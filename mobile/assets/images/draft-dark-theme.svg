<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-hidden="true">
  <!-- Draft / documents  two pages with dog-ear. Dark theme (light stroke + soft fill). -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Back sheet -->
    <rect
      x="88"
      y="124"
      width="248"
      height="320"
      rx="36"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="28"
    />
    <!-- Front sheet body (with dog-ear cutout at top-right) -->
    <path
      fill="#C5E4F5"
      stroke="#FFFFFF"
      stroke-width="28"
      d="
        M 168 68
        H 320
        L 400 148
        V 388
        A 36 36 0 0 1 364 424
        H 204
        A 36 36 0 0 1 168 388
        Z
      "
    />
    <!-- Dog-ear fold -->
    <path
      fill="none"
      stroke="#FFFFFF"
      stroke-width="28"
      d="M 320 68 V 148 H 400"
    />
    <!-- Text lines -->
    <path
      fill="none"
      stroke="#FFFFFF"
      stroke-width="24"
      d="
        M 212 220 H 280
        M 212 280 H 348
        M 212 340 H 320
      "
    />
  </g>
</svg>
